# Netlify configuration for the Thuy Le careers site.
[build]
  publish = "careers-site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/thank-you"
  [headers.values]
    X-Robots-Tag = "noindex"
